spring.application.name=weatherforecaster

spring.datasource.url=${DB_URL:jdbc:h2:file:/data/weatherdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:ranfagni}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# api url openmeteo
openmeteo.api.url=https://api.open-meteo.com/v1/forecast